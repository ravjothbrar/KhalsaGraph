<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KhalsaGraph</title>
  <script>
    // Redirect for GitHub Pages client-side routing
    var seg = window.location.pathname.replace('/KhalsaGraph', '');
    var query = window.location.search;
    var hash = window.location.hash;
    window.location.replace(
      '/KhalsaGraph/' +
      (seg ? '?p=' + encodeURIComponent(seg) : '') +
      (query ? (seg ? '&' : '?') + query.slice(1) : '') +
      hash
    );
  </script>
</head>
<body></body>
</html>

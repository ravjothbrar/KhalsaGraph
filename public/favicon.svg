<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#060B18"/>
  <g transform="translate(50,52)">
    <!-- Left Kirpan -->
    <g fill="#F97316">
      <path d="M-36,-30 C-34,-26 -23,-4 -21,6 L-19,6 C-20,-2 -30,-24 -33,-32 Z" opacity="0.92"/>
      <rect x="-22" y="6" width="5" height="2.5" rx="1.25" transform="rotate(-5)"/>
      <rect x="-21" y="8" width="3" height="6" rx="1" transform="rotate(-5)"/>
    </g>
    <!-- Right Kirpan -->
    <g fill="#F97316">
      <path d="M36,-30 C34,-26 23,-4 21,6 L19,6 C20,-2 30,-24 33,-32 Z" opacity="0.92"/>
      <rect x="17" y="6" width="5" height="2.5" rx="1.25" transform="rotate(5)"/>
      <rect x="18" y="8" width="3" height="6" rx="1" transform="rotate(5)"/>
    </g>
    <!-- Chakkar ring -->
    <circle cx="0" cy="-1" r="18" fill="none" stroke="#F97316" stroke-width="3.2"/>
    <!-- Central Khanda double-edged sword -->
    <g fill="#F97316">
      <!-- Blade (wide double-edged shape) -->
      <path d="M0,-40 L5,-18 L4.5,12 L0,20 L-4.5,12 L-5,-18 Z"/>
      <!-- Quillon / crossguard -->
      <rect x="-9.5" y="11" width="19" height="3.5" rx="1.75"/>
      <!-- Grip -->
      <rect x="-2.8" y="14.5" width="5.6" height="8" rx="1.4"/>
      <!-- Pommel -->
      <ellipse cx="0" cy="24" rx="4.5" ry="2.8"/>
    </g>
  </g>
</svg>

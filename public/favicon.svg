<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#060B18"/>
  <g transform="translate(50,50)">

    <!-- Left kirpan: curved blade pointing upper-left, handle at bottom-left -->
    <path d="M-38,-26 C-35,-34 -24,-26 -20,-14 C-18,-8 -18,-2 -18,4"
          fill="none" stroke="#F97316" stroke-width="3.2" stroke-linecap="round" opacity="0.92"/>
    <!-- Left kirpan guard -->
    <path d="M-21,3 L-15,5" stroke="#F97316" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Left kirpan handle -->
    <rect x="-19.5" y="5" width="3.5" height="8" rx="1.5" fill="#F97316" opacity="0.9"/>
    <!-- Left kirpan pommel -->
    <ellipse cx="-17.75" cy="14" rx="3" ry="2" fill="#F97316" opacity="0.9"/>

    <!-- Right kirpan: mirror -->
    <path d="M38,-26 C35,-34 24,-26 20,-14 C18,-8 18,-2 18,4"
          fill="none" stroke="#F97316" stroke-width="3.2" stroke-linecap="round" opacity="0.92"/>
    <!-- Right kirpan guard -->
    <path d="M21,3 L15,5" stroke="#F97316" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right kirpan handle -->
    <rect x="16" y="5" width="3.5" height="8" rx="1.5" fill="#F97316" opacity="0.9"/>
    <!-- Right kirpan pommel -->
    <ellipse cx="17.75" cy="14" rx="3" ry="2" fill="#F97316" opacity="0.9"/>

    <!-- Chakkar ring (throwing disc) -->
    <circle cx="0" cy="-2" r="18" fill="none" stroke="#F97316" stroke-width="3.4"/>

    <!-- Khanda: double-edged sword in centre -->
    <!-- Blade: wide double-edge shape, pointed top -->
    <path d="M0,-40 C3,-32 6,-18 6,-6 L0,4 L-6,-6 C-6,-18 -3,-32 0,-40 Z" fill="#F97316"/>
    <!-- Blade lower taper -->
    <path d="M-6,-6 L-4,8 L0,14 L4,8 L6,-6 L0,4 Z" fill="#F97316"/>
    <!-- Crossguard -->
    <rect x="-11" y="13" width="22" height="4" rx="2" fill="#F97316"/>
    <!-- Grip -->
    <rect x="-3.2" y="17" width="6.4" height="9" rx="1.6" fill="#F97316"/>
    <!-- Pommel -->
    <ellipse cx="0" cy="28" rx="5" ry="3.2" fill="#F97316"/>

  </g>
</svg>
